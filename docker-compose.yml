services:
    web:
        image: media-watchlist-web:latest
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        environment:
            VITE_API_URL: http://localhost:3000
        ports:
            - 5173:80
        depends_on:
            api:
                condition: service_healthy

    api:
        image: media-watchlist-api:latest
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        environment:
            PORT: 3000
            DATABASE_URL: postgresql://postgres:password@postgres:5432/media_watchlist
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_SECRET: change-me-to-a-secret-that-is-at-least-32-chars
            CLIENT_ORIGIN: http://localhost:5173
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            TMDB_API_READ_TOKEN: ${TMDB_API_READ_TOKEN:-your-tmdb-api-read-token}
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_FROM: noreply@example.com
            LOG_LEVEL: info
        ports:
            - 3000:3000
        healthcheck:
            test:
                ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/alive']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_started

    migrate:
        image: media-watchlist-api:latest
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        command: node apps/api/dist/db/migrate.js
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/media_watchlist
        depends_on:
            postgres:
                condition: service_healthy
        restart: 'no'

    api-hono:
        image: media-watchlist-api-hono:latest
        build:
            context: .
            dockerfile: apps/api-hono/Dockerfile
        environment:
            PORT: 3001
            DATABASE_URL: postgresql://postgres:password@postgres-hono:5432/media_watchlist_hono
            BETTER_AUTH_URL: http://localhost:3001
            BETTER_AUTH_SECRET: change-me-to-a-secret-that-is-at-least-32-chars
            CLIENT_ORIGIN: http://localhost:5173
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_FROM: noreply@example.com
        ports:
            - 3001:3001
        healthcheck:
            test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        depends_on:
            migrate-hono:
                condition: service_completed_successfully
            postgres-hono:
                condition: service_healthy
            mailpit:
                condition: service_started

    migrate-hono:
        image: media-watchlist-api-hono:latest
        build:
            context: .
            dockerfile: apps/api-hono/Dockerfile
        command: node apps/api-hono/dist/db/migrate.js
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres-hono:5432/media_watchlist_hono
        depends_on:
            postgres-hono:
                condition: service_healthy
        restart: 'no'

    postgres-hono:
        image: postgres:18.3
        user: postgres
        environment:
            POSTGRES_DB: media_watchlist_hono
            POSTGRES_PASSWORD: password
        ports:
            - 5433:5432
        volumes:
            - postgres_hono_data:/var/lib/postgresql
        restart: always
        healthcheck:
            test: ['CMD', 'pg_isready']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:18.3
        user: postgres
        environment:
            POSTGRES_DB: media_watchlist
            POSTGRES_PASSWORD: password
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql
        restart: always
        healthcheck:
            test: ['CMD', 'pg_isready']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    mailpit:
        image: axllent/mailpit:v1.22.3
        environment:
            MP_DATABASE: /data/mailpit.db
        ports:
            - 1025:1025
            - 8025:8025
        volumes:
            - mailpit_data:/data
        restart: always

volumes:
    postgres_data:
    postgres_hono_data:
    mailpit_data:
